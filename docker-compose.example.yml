services:
  comments-preview-server:
    build: .
    restart: unless-stopped
    working_dir: /app

    environment:
      PORT: 8080
      DEVELOPMENT: "false"
      BOOMLINGS_AUTH: ""
      BOOMLINGS_ENDPOINT: "https://www.boomlings.com/database/getGJComments21.php"

      UMAMI_ENDPOINT: ""
      UMAMI_HOSTNAME: ""
      UMAMI_WEBSITE_ID: ""
    ports:
      - "8080:8080"
