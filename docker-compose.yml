services:
  comments-preview-server:
    image: oven/bun:latest
    restart: always
    working_dir: /app

    environment:
      PORT: ${PORT}
      DEVELOPMENT: ${DEVELOPMENT}

    ports:
      - "${PORT}:${PORT}"

    volumes:
      - .:/app

    command: [ "sh", "-c", "bun install && bun run main.js" ]
